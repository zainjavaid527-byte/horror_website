<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      div{
        height: 150px;
        width:150px;
        background-color: aqua;
        position: relative;
        animation-name: animate;
        animation-duration: 5s;
        animation-delay: ;
        
      }

      @keyframes animate{
        0%{
            top:0;
            left:0;
        }
        25%{
            top:0;
            left:400px;
        }
        50%{
            left:400px;
            top:400px;
        }
        75%{
            top: 400px;
            left:0;
        }
        100%{
           top: 0;
           left: 0;
        }
      }
    </style>
</head>
<body>
  <div>

  </div>
</body>
</html>
