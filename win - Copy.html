<!DOCTYPE html>
<html>
<head>
   
    <title>Document</title>
<style>
div{
    margin: 0;
    padding: 0;
    height: 100px;
    width: 100px;
    background-color: aqua;
    position: relative;
    animation:animate ;
    animation-duration: 2s;
    animation-iteration-count: 5;
    animation-delay: 0s;
    animation-timing-function: linear;
    animation-fill-mode: none;
    animation-direction:inherit;
  
}

@keyframes animate {
    from{
        top: 0;
        left: 0;
    }
    
    to{
        top: 0;
        left: 1000px;
    }
}

</style>
</head>
<body>
<div>

</div>
</body>
</html>
