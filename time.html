<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
<h1 id="h1">00</h1>
<h1 id="h2">00</h1>
<h1 id="h3">00</h1>

<script>

    function fun(){
    let hours =document.getElementById('h1');
    let minutes =document.getElementById('h2');
    let seconds =document.getElementById('h3');

    let h = new Date().getHours();
    let m = new Date().getMinutes();
    let s = new Date().getSeconds();

    if(h > 12){
        h  = h - 12;
    }

    h = (h < 10) ? "0" + h: h;
    m = (m < 10) ? "0" + m: m;
    s = (s < 10) ? "0" + s: s;

    hours.innerHTML=h;
    minutes.innerHTML=m;
    seconds.innerHTML=s;
}

setInterval(fun,1000);




</script>

</body>
</html>
