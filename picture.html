<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        .div{
            border: 2px solid black;
            float: left;
            border-radius: 15px;
            height: 400px;
            margin: 50px;
            position: relative;
        }
        img{
            border-radius: 10px;
            height: 100%;
            width: 100%;
        }
        .div::before{
            content: "";
            background-color: red;
            height: 100%;
            width: 100%;
            position: absolute;
        }
    </style>
</head>
<body>
    <div class="div">
    <img src="hr2.jpeg">
</div>
</body>
</html>
