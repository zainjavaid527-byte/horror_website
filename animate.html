<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="E:/web designing/bootstrap.css">
<style>
   

   .div1:hover{
    
    /*transform: rotate(45deg);*/
    /*transform: scale(2);*/
   /* transform: translate(100px,50px);*/
   /*transform: skew(45deg);*/

   }
   body{
    background-color: lightgray;
   }
   #sub,#sub2{
  
    margin-left:500px;
    margin-top: 100px;
    font-size: 30px;
    border-radius: 10px;
    background-color: white;
    border: 2px solid blue;
    color:blue;
    position: relative;
    z-index: 1;
    overflow:hidden ;
    width: 200px;
    transition: .5s all ease;

   }

   /*button 1*/
   #sub::before{
    content: "";
    height: 100%;
    width: 100%;
    background-color: green;
    position: absolute;
    top: 0px;
    left: 0px;
    z-index: -1;
    transition: .5s all ease;
    transform: translate(-90%);
    
    
   }
   
   #sub:hover::before{
    transform: translate(0%);
   
    
   }
   #sub:hover{
    color: white;
    border: 2px solid white;
   }

    /*button 2*/

   #sub2::before{
    content: "";
    height: 100%;
    width: 100%;
    background-color: red;
    position: absolute;
    top: 0px;
    left: 0px;
    z-index: -1;
    transition: .5s all ease;  
    transform: translate(-90%);  
   }

   #sub2::after{
    content: "";
    height: 100%;
    width: 100%;
    background-color: red;
    position: absolute;
    top: 0px;
    left: 0px;
    z-index: -1;
    transition: .5s all ease;  
    transform: translate(90%);  
   }
   

   #sub2:hover::before{
    transform: translate(-50%);
   
    
   }
   
   
   #sub2:hover::after{
    transform: translate(50%);
   
    
   }
   #sub2:hover{
    color: white;
    border: 2px solid white;
   }

</style>
</head>
<body>
    
          
<button id="sub">Submit 1</button>
<button id="sub2">Submit 1</button>
       
        
 
</body>
</html>
